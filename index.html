<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест: Пожежна безпека</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}
.glass {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    padding: 2.5rem;
    width: 100%;
    max-width: 650px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.37);
    text-align: center;
}
h2 { margin-bottom: 1rem; font-size: 1.8rem; }
p { margin-bottom: 1.5rem; line-height: 1.5; color: rgba(255,255,255,0.9); }
input {
    width: 100%;
    padding: 14px;
    margin: 10px 0;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.15);
    color: #fff;
    font-size: 1rem;
    outline: none;
}
input::placeholder { color: rgba(255,255,255,0.6); }
input:focus { background: rgba(255,255,255,0.25); border-color: #4caf50; }
button {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    border-radius: 10px;
    border: none;
    background: #4caf50;
    color: white;
    font-size: 1.1rem;
    font-weight: bold;
    cursor: pointer;
}
button:hover { background: #45a049; }
.option-btn {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.3);
    text-align: left;
    margin: 10px 0;
    font-weight: normal;
    padding: 14px;
    border-radius: 10px;
    color: white;
    width: 100%;
    cursor: pointer;
    font-size: 1rem;
}
.option-btn:hover { background: rgba(255,255,255,0.25); }
#timer-container {
    width: 100%;
    height: 8px;
    background: rgba(255,255,255,0.2);
    border-radius: 4px;
    margin-bottom: 1.5rem;
    overflow: hidden;
}
#timer-bar {
    height: 100%;
    width: 100%;
    background: #4caf50;
    border-radius: 4px;
    transition: width 1s linear;
}
.timer-danger { background: #f44336 !important; }
#progress-container {
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 3px;
    margin-bottom: 1rem;
    overflow: hidden;
}
#progress-bar {
    height: 100%;
    width: 0%;
    background: #2196f3;
    border-radius: 3px;
    transition: width 0.3s;
}
#violation-badge {
    position: fixed;
    top: 20px;
    right: 20px;
    background: rgba(244, 67, 54, 0.95);
    color: white;
    padding: 12px 24px;
    border-radius: 10px;
    font-weight: bold;
    display: none;
    z-index: 1000;
}
.status-msg {
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 15px;
    font-weight: bold;
    display: none;
}
.status-restored { background: rgba(76,175,80,0.3); border: 1px solid #4caf50; color: #a5d6a7; }
.status-blocked { background: rgba(244,67,54,0.3); border: 1px solid #f44336; color: #ef9a9a; }
#bot-status {
    position: fixed;
    top: 20px;
    left: 20px;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: bold;
    z-index: 1000;
}
.bot-ok { background: rgba(76,175,80,0.9); color: white; }
.bot-err { background: rgba(244,67,54,0.9); color: white; }
.bot-check { background: rgba(255,193,7,0.9); color: #333; }
.hidden { display: none !important; }
.small-btn {
    background: rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.3);
    padding: 8px;
    font-size: 0.85rem;
    width: auto;
    margin: 5px;
}
</style>
</head>
<body>

<div id="bot-status" class="bot-check">🔍 Перевірка бота...</div>
<div id="violation-badge">Порушень: 0/3</div>

<!-- СТАРТОВИЙ ЕКРАН -->
<div id="start-screen" class="glass">
    <h2>🔥 Пожежна безпека</h2>
    <p>Тест для студентів медичного коледжу<br>20 питань • 12 секунд на питання</p>
    
    <div id="restored-msg" class="status-msg status-restored">🔓 Доступ відновлено вчителем</div>
    <div id="block-msg" class="status-msg status-blocked"></div>

    <input type="text" id="student-name" placeholder="Прізвище та ім'я">
    <input type="text" id="student-group" placeholder="Група (напр. 10-А)">
    <button onclick="startTest()">Розпочати тест</button>
    <button class="small-btn" onclick="testBot()">🔍 Перевірити зв'язок з ботом</button>
    <button class="small-btn" onclick="teacherReset()">👨‍🏫 Скинути (для вчителя)</button>
</div>

<!-- ЕКРАН ТЕСТУ -->
<div id="quiz-screen" class="glass hidden">
    <div id="progress-container"><div id="progress-bar"></div></div>
    <div id="timer-container"><div id="timer-bar"></div></div>
    <h3 id="question-text" style="margin-bottom: 1.5rem; font-size: 1.2rem; min-height: 60px;"></h3>
    <div id="options-container"></div>
</div>

<!-- ЕКРАН РЕЗУЛЬТАТІВ -->
<div id="result-screen" class="glass hidden">
    <h2>✅ Тест завершено</h2>
    <div id="result-details" style="margin: 20px 0; font-size: 1.1rem; line-height: 1.8;"></div>
    <p style="color: #a5d6a7; font-weight: bold;">Результати надіслано викладачу.</p>
    <button onclick="location.reload()">На головну</button>
</div>

<script>
// ============ КОНФІГУРАЦІЯ ============
const TG_TOKEN = '8977852457:AAH1jJz54Wb5WFxNn1CrpBlRKbML7Pf_2zs';
const TG_CHAT_ID = '622617127';

// ============ 20 ПИТАНЬ ============
const rawQuestions = [
    { q: "Що таке горіння?", options: ["Процес плавлення твердих матеріалів", "Випаровування рідин за високої температури", "Складний фізико-хімічний процес перетворення горючих речовин із виділенням теплоти, світла й полум'я", "Будь-яке нагрівання тіла понад 100 °C"], correct: 2 },
    { q: "Що таке пожежа?", options: ["Контрольоване спалювання сміття на спеціальному майданчику", "Неконтрольоване горіння поза спеціальним вогнищем, що завдає матеріальних збитків і шкоди життю та здоров'ю людей", "Швидке згорання парогазової суміші", "Повільне окислення металів"], correct: 1 },
    { q: "Який єдиний номер телефону для виклику рятувальників в Україні?", options: ["102", "103", "101", "104"], correct: 2 },
    { q: "Яка ваша перша дія при виявленні ознак пожежі в навчальному закладі?", options: ["Спробувати самостійно загасити вогонь", "Повідомити за номером 101 та ввімкнути ручний пожежний сповіщувач", "Сховатися в найближчій шафі", "Зателефонувати друзям"], correct: 1 },
    { q: "Чому заборонено користуватися ліфтом під час пожежі?", options: ["Ліфт може зупинитися через відключення електроенергії", "Ліфт рухається занадто повільно", "Ліфт призначений лише для вантажів", "У ліфті немає сигналізації"], correct: 0 },
    { q: "Який вогнегасник найбезпечніший для гасіння електрообладнання під напругою?", options: ["Водний", "Пінний", "Вуглекислотний або порошковий", "Пісочний"], correct: 2 },
    { q: "Що таке евакуація?", options: ["Хаотичний вихід через вікна", "Організований процес виведення людей із зони небезпеки", "Процес гасіння пожежі", "Переміщення майна"], correct: 1 },
    { q: "Чому не можна гасити водою електроприлади під напругою?", options: ["Вода швидко випаровується", "Вода є провідником електричного струму", "Вода пошкоджує корпус", "Вода змінює колір полум'я"], correct: 1 },
    { q: "Що таке тління?", options: ["Швидке горіння з вибухом", "Повільне горіння твердих речовин без полум'я з виділенням диму", "Миттєве займання рідини", "Нагрівання металу"], correct: 1 },
    { q: "Якого кольору бувають евакуаційні вказівники?", options: ["Червоного", "Жовтого", "Зеленого", "Синього"], correct: 2 },
    { q: "Що таке пожежне навантаження?", options: ["Вага пожежного обладнання", "Кількість теплоти, яка може виділитися при згоранні матеріалів на одиниці площі", "Кількість вогнегасників на поверх", "Швидкість поширення вогню"], correct: 1 },
    { q: "Яка правильна послідовність дій з порошковим вогнегасником?", options: ["Натиснути важіль, спрямувати розтруб, вирвати пломбу", "Спрямувати розтруб, вирвати пломбу, натиснути важіль", "Вирвати пломбу, спрямувати розтруб на вогнище, натиснути важіль", "Потрясти, кинути в вогонь"], correct: 2 },
    { q: "Що таке спалах?", options: ["Швидке згорання парогазової суміші без утворення стиснених газів", "Тривале горіння деревини", "Вибух балона", "Самозаймання ганчір'я"], correct: 0 },
    { q: "Найпоширеніша причина пожеж у навчальних закладах?", options: ["Блискавка", "Порушення правил експлуатації електрообладнання та необережне поводження з вогнем", "Виверження вулкана", "Самозаймання стін"], correct: 1 },
    { q: "Що робити, якщо на людині загорівся одяг?", options: ["Дати їй бігти", "Зупинити, повалити на землю та накрити щільною тканиною", "Гасити водою з відра", "Зірвати одяг голими руками"], correct: 1 },
    { q: "Що таке самозаймання?", options: ["Горіння через різке прискорення екзотермічних реакцій без зовнішнього джерела", "Займання від сірника", "Займання від іскри", "Займання від блискавки"], correct: 0 },
    { q: "Чи дозволено блокувати евакуаційні виходи меблями?", options: ["Дозволяється на 10 хв", "Дозволяється за згодою адміністрації", "Категорично заборонено", "Дозволяється при дублюванні виходу"], correct: 2 },
    { q: "Що таке вогнегасна речовина?", options: ["Будь-яка рідина в будівлі", "Речовина, яка забезпечує припинення горіння (вода, піна, порошок, CO₂)", "Матеріал, який швидко займається", "Пристрій для виклику пожежної охорони"], correct: 1 },
    { q: "Який клас пожежі — горіння твердих речовин?", options: ["Клас A", "Клас B", "Клас C", "Клас D"], correct: 0 },
    { q: "Що робити, якщо шлях евакуації заблоковано димом?", options: ["Бігти крізь дим", "Пересуватися повзком, дихати через вологу тканину", "Стрибнути з вікна", "Сховатися в шафу"], correct: 1 }
];

// ============ СТАН ============
let quizQuestions = [], currentQuestion = 0, score = 0, violations = 0;
let timeLeft = 12, timerInterval = null;
let studentName = '', studentGroup = '';
let testStarted = false, testFinished = false;
let botOnline = false;

// ============ УТИЛІТИ ============
function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function getGrade(s) {
    if (s >= 19) return 5;
    if (s >= 15) return 4;
    if (s >= 11) return 3;
    if (s >= 6) return 2;
    return 1;
}

// ============ TELEGRAM ============
async function tgRequest(method, params = {}) {
    const url = `https://api.telegram.org/bot${TG_TOKEN}/${method}`;
    try {
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(params)
        });
        return await response.json();
    } catch (e) {
        console.error('Telegram error:', e);
        return null;
    }
}

async function sendTelegramMessage(text) {
    const res = await tgRequest('sendMessage', {
        chat_id: TG_CHAT_ID,
        text: text,
        parse_mode: 'HTML'
    });
    return res && res.ok;
}

async function checkBot() {
    const status = document.getElementById('bot-status');
    status.className = 'bot-check';
    status.textContent = '🔍 Перевірка бота...';
    
    const res = await tgRequest('getMe');
    if (res && res.ok && res.result) {
        botOnline = true;
        status.className = 'bot-ok';
        status.textContent = `✅ Бот: @${res.result.username}`;
        return true;
    } else {
        botOnline = false;
        status.className = 'bot-err';
        status.textContent = `❌ Бот недоступний: ${res?.description || 'помилка'}`;
        return false;
    }
}

async function checkTelegramUpdates() {
    if (!botOnline) return;
    const offset = localStorage.getItem('fire_safety_tg_offset') || 0;
    try {
        const res = await tgRequest('getUpdates', { offset: offset, timeout: 0 });
        if (res && res.ok && res.result && res.result.length > 0) {
            for (const update of res.result) {
                if (update.message && update.message.chat && update.message.chat.id.toString() === TG_CHAT_ID) {
                    const text = update.message.text.trim();
                    if (text === '/скинути всі') {
                        localStorage.removeItem('fire_safety_results');
                        await sendTelegramMessage('✅ Очищено всі записи');
                        location.reload();
                    } else if (text.startsWith('/скинути ')) {
                        const query = text.substring(9).trim().toLowerCase();
                        let results = JSON.parse(localStorage.getItem('fire_safety_results') || '[]');
                        let found = null;
                        let newResults = [];
                        for (let r of results) {
                            const rKey = `${r.name} ${r.group}`.trim().toLowerCase();
                            if (rKey === query) {
                                found = r;
                            } else {
                                newResults.push(r);
                            }
                        }
                        if (found) {
                            localStorage.setItem('fire_safety_results', JSON.stringify(newResults));
                            localStorage.setItem('fire_safety_restored', 'true');
                            await sendTelegramMessage(`✅ Скинуто: ${found.name}, ${found.group}`);
                        } else {
                            await sendTelegramMessage('⚠️ Такого запису немає на цьому пристрої');
                        }
                    }
                }
                if (update.update_id) {
                    localStorage.setItem('fire_safety_tg_offset', update.update_id + 1);
                }
            }
            updateStartScreenUI();
        }
    } catch (e) {
        console.error('Polling error:', e);
    }
}

async function testBot() {
    const ok = await checkBot();
    if (ok) {
        const sent = await sendTelegramMessage('🧪 <b>Тест зв\'язку</b>\nПристрій: ' + navigator.userAgent.substring(0, 80));
        alert(sent ? '✅ Бот працює! Перевірте повідомлення в Telegram.' : '❌ Не вдалося надіслати повідомлення');
    } else {
        alert('❌ Бот недоступний. Перевірте токен або інтернет.');
    }
}

// ============ УЧИТЕЛЬСЬКЕ СКИДАННЯ (локальне) ============
function teacherReset() {
    const pwd = prompt('Введіть код вчителя:');
    if (pwd === 'teacher2024') {
        const name = prompt('ПІБ учня (або "всі"):');
        if (!name) return;
        if (name.toLowerCase() === 'всі') {
            localStorage.removeItem('fire_safety_results');
            alert('✅ Очищено всі записи');
            location.reload();
        } else {
            let results = JSON.parse(localStorage.getItem('fire_safety_results') || '[]');
            const newResults = results.filter(r => 
                `${r.name} ${r.group}`.trim().toLowerCase() !== name.trim().toLowerCase()
            );
            if (newResults.length < results.length) {
                localStorage.setItem('fire_safety_results', JSON.stringify(newResults));
                localStorage.setItem('fire_safety_restored', 'true');
                alert('✅ Запис видалено');
                location.reload();
            } else {
                alert('⚠️ Запис не знайдено');
            }
        }
    } else if (pwd !== null) {
        alert('❌ Невірний код');
    }
}

// ============ UI ============
function updateStartScreenUI() {
    const restored = localStorage.getItem('fire_safety_restored');
    const msgEl = document.getElementById('restored-msg');
    const blockEl = document.getElementById('block-msg');
    if (restored === 'true') {
        if (msgEl) msgEl.style.display = 'block';
        if (blockEl) blockEl.style.display = 'none';
        localStorage.removeItem('fire_safety_restored');
    }
}

// ============ АНТИ-ЧИТ ============
function triggerViolation() {
    if (testFinished || !testStarted) return;
    violations++;
    const badge = document.getElementById('violation-badge');
    badge.textContent = `⚠️ Порушень: ${violations}/3`;
    badge.style.display = 'block';
    if (violations >= 3) finishTest(true);
}

document.addEventListener('visibilitychange', () => {
    if (document.hidden && testStarted && !testFinished) triggerViolation();
});

document.addEventListener('keydown', (e) => {
    if (!testStarted || testFinished) return;
    if (e.key === 'F12' || 
        (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key)) ||
        (e.ctrlKey && ['u','c','v','x'].includes(e.key.toLowerCase())) ||
        e.key === 'PrintScreen') {
        e.preventDefault();
        triggerViolation();
    }
});

document.addEventListener('contextmenu', (e) => {
    if (testStarted && !testFinished) {
        e.preventDefault();
        triggerViolation();
    }
});

// ============ ТЕСТ ============
function checkPrevious(name, group) {
    const results = JSON.parse(localStorage.getItem('fire_safety_results') || '[]');
    const key = `${name} ${group}`.trim().toLowerCase();
    for (let r of results) {
        if (`${r.name} ${r.group}`.trim().toLowerCase() === key) return r;
    }
    return null;
}

function startTest() {
    studentName = document.getElementById('student-name').value.trim();
    studentGroup = document.getElementById('student-group').value.trim();

    if (!studentName || !studentGroup) {
        alert('Введіть Прізвище та ім\'я, а також Групу');
        return;
    }

    const prev = checkPrevious(studentName, studentGroup);
    if (prev) {
        const blockEl = document.getElementById('block-msg');
        blockEl.innerHTML = `🚫 Ви вже проходили цей тест.<br><b>Дата:</b> ${prev.date}<br><b>Оцінка:</b> ${prev.grade}`;
        blockEl.style.display = 'block';
        document.getElementById('restored-msg').style.display = 'none';
        return;
    }

    testStarted = true;
    quizQuestions = shuffle(rawQuestions).map(q => {
        const correctText = q.options[q.correct];
        const shuffled = shuffle(q.options);
        return { q: q.q, options: shuffled, correctIndex: shuffled.indexOf(correctText) };
    });

    // Повноекранний режим (опціонально)
    try {
        if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen().catch(() => {});
        }
    } catch (e) {}

    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('quiz-screen').classList.remove('hidden');
    loadQuestion();
}

function loadQuestion() {
    if (currentQuestion >= quizQuestions.length) {
        finishTest();
        return;
    }
    const qData = quizQuestions[currentQuestion];
    document.getElementById('question-text').textContent = 
        `Питання ${currentQuestion + 1} / ${quizQuestions.length}: ${qData.q}`;
    
    const opts = document.getElementById('options-container');
    opts.innerHTML = '';
    qData.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = opt;
        btn.onclick = () => selectAnswer(idx);
        opts.appendChild(btn);
    });

    document.getElementById('progress-bar').style.width = 
        `${(currentQuestion / quizQuestions.length) * 100}%`;

    timeLeft = 12;
    updateTimerUI();
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerUI();
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            selectAnswer(-1);
        }
    }, 1000);
}

function updateTimerUI() {
    const bar = document.getElementById('timer-bar');
    bar.style.width = `${(timeLeft / 12) * 100}%`;
    if (timeLeft < 5) bar.classList.add('timer-danger');
    else bar.classList.remove('timer-danger');
}

function selectAnswer(id
